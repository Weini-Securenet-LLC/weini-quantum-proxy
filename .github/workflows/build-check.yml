name: Build Check

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - '.github/workflows/build-check.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
  
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
  
  build-check:
    name: Build Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      
      - name: Download Go modules
        run: go mod download

      - name: Prepare embedded sing-box asset
        shell: bash
        run: |
          mkdir -p internal/wailsapp/assets/windows
          if [ ! -f internal/wailsapp/assets/windows/sing-box.exe ]; then
            python3 scripts/fetch_sing_box.py --os windows --arch amd64 --output-dir internal/wailsapp/assets/windows || true
          fi
          if [ ! -f internal/wailsapp/assets/windows/sing-box.exe ]; then
            echo "placeholder" > internal/wailsapp/assets/windows/sing-box.exe
          fi
      
      - name: Build check (Wails core, portable)
        shell: bash
        run: |
          # Use a deterministic, dependency-light target for CI compile checks.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags production ./cmd/proxy-node-studio-wails
      
      - name: Build check (CLI)
        working-directory: cmd/proxy-node-studio
        run: go build -v .
