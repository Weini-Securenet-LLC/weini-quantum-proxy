name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.22'

jobs:
  build:
    name: Build Core Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build Linux CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/ProxyNodeStudio-go ./cmd/proxy-node-studio

      - name: Prepare Windows embedded runtime
        run: |
          mkdir -p internal/wailsapp/assets/windows
          python3 scripts/fetch_sing_box.py --os windows --arch amd64 --output-dir internal/wailsapp/assets/windows

      - name: Build Windows desktop binary
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags production -ldflags="-s -w" -o dist/weini-quantum-proxy-windows-amd64.exe ./cmd/proxy-node-studio-wails

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-binaries
          path: |
            dist/ProxyNodeStudio-go
            dist/weini-quantum-proxy-windows-amd64.exe
          if-no-files-found: error
