name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GO_VERSION: '1.22'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            goos: windows
            goarch: amd64
            output_name: weini-quantum-proxy-windows-amd64.exe
            artifact_name: windows-amd64
          
          # Linux builds
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output_name: weini-quantum-proxy-linux-amd64
            artifact_name: linux-amd64
          
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            output_name: weini-quantum-proxy-linux-arm64
            artifact_name: linux-arm64
          
          # macOS builds
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output_name: weini-quantum-proxy-darwin-amd64
            artifact_name: darwin-amd64
          
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output_name: weini-quantum-proxy-darwin-arm64
            artifact_name: darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Set up Wails (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          
      - name: Set up Wails (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Prepare sing-box embed (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          mkdir -p internal/wailsapp/assets/windows
          python3 scripts/fetch_sing_box.py --os windows --arch amd64 --output-dir internal/wailsapp/assets/windows

      - name: Build Wails application
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd cmd/proxy-node-studio-wails
          wails build -clean -platform ${{ matrix.goos }}/${{ matrix.goarch }}

      - name: Prepare sing-box for release archive
        shell: bash
        run: |
          mkdir -p runtime
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp internal/wailsapp/assets/windows/sing-box.exe runtime/
          else
            python3 scripts/fetch_sing_box.py --os ${{ matrix.goos }} --arch ${{ matrix.goarch }} --output-dir runtime
          fi

      - name: Package application (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          mkdir dist/${{ matrix.artifact_name }}
          Copy-Item "cmd/proxy-node-studio-wails/build/bin/weini-quantum-proxy.exe" "dist/${{ matrix.artifact_name }}/${{ matrix.output_name }}"
          mkdir dist/${{ matrix.artifact_name }}/runtime
          Copy-Item "runtime/sing-box.exe" "dist/${{ matrix.artifact_name }}/runtime/" -ErrorAction SilentlyContinue

      - name: Package application (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}/runtime
          cp cmd/proxy-node-studio-wails/build/bin/* dist/${{ matrix.artifact_name }}/${{ matrix.output_name }} || true
          cp runtime/sing-box dist/${{ matrix.artifact_name }}/runtime/ || true
          chmod +x dist/${{ matrix.artifact_name }}/${{ matrix.output_name }}

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Compress-Archive -Path dist/${{ matrix.artifact_name }}/* -DestinationPath weini-quantum-proxy-${{ matrix.artifact_name }}.zip

      - name: Create archive (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist/${{ matrix.artifact_name }}
          tar -czf ../../weini-quantum-proxy-${{ matrix.artifact_name }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            weini-quantum-proxy-${{ matrix.artifact_name }}.zip
            weini-quantum-proxy-${{ matrix.artifact_name }}.tar.gz
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: weinidaohang/quantum-proxy
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
